<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - CareNest</title>

  <!-- Favicon -->
  <link rel="icon" href="assets/images/logo.png" type="image/x-icon">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
  
  <style>
    html, body {
      height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .split-container {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
    }
    .split-row {
      flex: 1;
    }
    .side-image-panel {
      position: relative;
      min-height: 400px;
    }
    .side-image-panel img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .side-image-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(15, 92, 94, 0.85) 0%, rgba(15, 92, 94, 0.4) 100%);
      z-index: 1;
    }
    .side-image-content {
      position: absolute;
      bottom: 10%;
      left: 10%;
      right: 10%;
      z-index: 2;
      max-width: 460px;
    }
    .form-panel {
      background-color: var(--background);
    }
    .login-form-wrapper {
      width: 100%;
      max-width: 440px;
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg main-nav py-3">
    <div class="container">
      <a class="brand-logo-container" href="index">
        <div class="brand-logo-frame">
          <img src="assets/images/logo.png" alt="Logo" width="70" height="70">
        </div>
        <span class="brand-text">CareNest</span>
      </a>
    </div>
  </nav>

  <!-- Split View Main Container -->
  <main class="container-fluid p-0 flex-grow-1 d-flex flex-column split-container">
    <div class="row g-0 flex-grow-1 split-row">
      
      <!-- Left Column -->
      <div class="col-lg-6 d-none d-lg-block side-image-panel">
        <img src="assets/images/carem7.jpg" alt="Mother caring for child">
        <div class="side-image-overlay"></div>
        <div class="side-image-content text-white">
          <span class="badge text-uppercase mb-3 px-3 py-2" style="background-color: var(--accent); color: var(--text-color); font-weight:700;">
            <i class="fa-solid fa-shield-heart me-1"></i> Trust & Comfort
          </span>
          <h2 class="fw-bold mb-3 display-6">Caring for What Matters Most</h2>
        </div>
      </div>

      <!-- login form -->
      <div class="col-lg-6 d-flex flex-column justify-content-between form-panel py-5 px-4 px-md-5">
        
        <!-- center login -->
        <div class="container px-0 mb-4" id="alertContainer"></div>

        <div class="d-flex align-items-center justify-content-center flex-grow-1">
          <div class="login-form-wrapper">
            <div class="card p-4 p-md-5 border-0 shadow-sm" style="border-radius: 20px; background-color: var(--white);">
              
              <div class="text-center mb-4">
                <div class="brand-logo-frame mx-auto mb-3" style="width: 56px; height: 56px; border-radius: 16px;">
                  <i class="fa-solid fa-unlock-keyhole" style="font-size: 1.5rem;"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
                <p class="text-muted small mb-0">Sign in to your secure parent workspace</p>
              </div>

              <div class="alert alert-info py-2 px-3 mb-4 small d-flex align-items-center border-0" style="background-color: var(--secondary); color: var(--primary); border-radius: 10px;">
                <i class="fa-solid fa-circle-info me-2" style="font-size: 1.1rem;"></i> 
                <span>Login to evaluate your child <strong>today</strong>.</span>
              </div>

              <!-- Secure login trigger -->
              <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-3">
                  <label for="loginEmail" class="form-label fw-semibold small text-muted">Email Address</label>
                  <input type="email" class="form-control py-2.5" id="loginEmail" name="email" placeholder="parent@gmail.com" required style="border-radius: 8px; border-color: var(--border);">
                </div>
                <div class="mb-4">
                  <label for="loginPassword" class="form-label fw-semibold small text-muted">Password</label>
                  <input type="password" class="form-control py-2.5" id="loginPassword" name="password" placeholder="Enter your password" required style="border-radius: 8px; border-color: var(--border);">
                  <div class="text-end mt-2">
                    <a href="forgot-password.html" class="small fw-semibold text-decoration-none" style="color: var(--primary);">Forgot Password?</a>
                  </div>
                </div>
                <button type="submit" class="btn btn-primary-custom w-100 py-2.5">
                  <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Access Dashboard
                </button>
              </form>
              
              <div class="text-center mt-4">
                <p class="text-muted small mb-0">New here? <a href="register" class="fw-semibold text-decoration-none" style="color: var(--primary);">Register Account &rarr;</a></p>
              </div>

            </div>
          </div>
        </div>

        <!-- Footer -->
        <footer class="text-center pt-4 border-top" style="border-color: var(--border);">
          <p class="text-muted small mb-1">&copy; 2026 CareNest. All rights reserved.</p>
        </footer>

      </div>

    </div>
  </main>

  <!-- Core Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    async function handleLogin(event) {
      event.preventDefault();

      Swal.fire({
        title: 'Signing In...',
        text: 'Please wait while we confirm your details.',
        allowOutsideClick: false,
        didOpen: () => {
          Swal.showLoading();
        }
      });

      const formData = new FormData(document.getElementById('loginForm'));

      try {
        const response = await fetch('process.php?action=login', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        await new Promise(resolve => setTimeout(resolve, 1000));

        if (result.success) {
          let countdown = 2;

          Swal.fire({
            icon: 'success',
            title: 'Welcome Back!',
            html: `
              <p class="mb-2"><strong>${result.name}</strong></p>
              <p class="mb-2">${result.message}</p>
              <p class="small text-muted">
                Redirecting to your dashboard in
                <strong id="redirectCount">${countdown}</strong> seconds...
              </p>
            `,
            timer: 2000,
            timerProgressBar: true,
            showConfirmButton: false,
            allowOutsideClick: false,
            didOpen: () => {
              const countText = document.getElementById('redirectCount');

              const countdownTimer = setInterval(() => {
                countdown--;
                countText.textContent = countdown;

                if (countdown <= 0) {
                  clearInterval(countdownTimer);
                }
              }, 1000);
            }
          }).then(() => {
            window.location.href = 'dashboard';
          });

        } else {
          Swal.fire({
            title: 'Login Failed',
            text: result.message,
            icon: 'error',
            confirmButtonColor: '#0F5C5E'
          });
        }

      } catch (error) {
        await new Promise(resolve => setTimeout(resolve, 1000));

        Swal.fire({
          title: 'Connection Error',
          text: 'Could not connect to the server. Please try again.',
          icon: 'error',
          confirmButtonColor: '#0F5C5E'
        });
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - CareNest</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="container py-5 flex-grow-1 d-flex align-items-center">
    <div class="auth-card w-100 my-4">
      <div class="text-center mb-4">
        <div class="brand-logo-frame mx-auto mb-3" style="width: 56px; height: 56px; border-radius: 16px;">
          <i class="fa-solid fa-key" style="font-size: 1.5rem;"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Forgot Password</h3>
        <p class="text-muted small mb-0">Enter your account email to receive a secure reset link.</p>
      </div>

      <form id="forgotPasswordForm">
        <div class="mb-4">
          <label for="resetEmail" class="form-label fw-semibold small text-muted">Email Address</label>
          <input
            type="email"
            class="form-control py-2"
            id="resetEmail"
            name="email"
            placeholder="parent@gmail.com"
            autocomplete="email"
            required
          >
        </div>
        <button type="submit" class="btn btn-primary-custom w-100 py-2">
          <i class="fa-solid fa-paper-plane me-2"></i> Send Reset Link
        </button>
      </form>

      <div class="text-center mt-4">
        <a href="login" class="fw-semibold text-decoration-none" style="color: var(--primary);">
          <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
        </a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    emailjs.init({ publicKey: "Sd2JlDEa-A0biWBO2" });

    document.getElementById("forgotPasswordForm").addEventListener("submit", async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const requestStartedAt = Date.now();

      Swal.fire({
        title: "Sending Reset Link...",
        text: "Please wait while CareNest prepares your secure link.",
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      try {
        const response = await fetch("process.php?action=request_password_reset", {
          method: "POST",
          body: new FormData(form)
        });
        const responseText = await response.text();
        let result;

        try {
          result = JSON.parse(responseText);
        } catch (error) {
          throw new Error("The server returned an invalid response.");
        }

        if (!response.ok || !result.success) {
          throw new Error(result.message || "The reset request failed.");
        }

        const emailDelivery = result.email_params
          ? emailjs.send(
            "service_gea9hfn",
            "template_fkzqkau",
            result.email_params
          )
          : Promise.resolve();
        let deliveryError = null;
        let resultDisplayed = false;

        emailDelivery.catch(error => {
          deliveryError = error;
          console.error(error);

          if (resultDisplayed) {
            Swal.fire({
              icon: "error",
              title: "Email Delivery Failed",
              text: error.text || "The reset email could not be delivered. Please try again.",
              confirmButtonColor: "#0F5C5E"
            });
          }
        });

        const remainingDelay = 1000 - (Date.now() - requestStartedAt);
        if (remainingDelay > 0) {
          await new Promise(resolve => setTimeout(resolve, remainingDelay));
        }

        if (deliveryError) throw deliveryError;
        resultDisplayed = true;

        await Swal.fire({
          icon: "success",
          title: "Check Your Email",
          text: result.message,
          confirmButtonColor: "#0F5C5E"
        });

        form.reset();
      } catch (error) {
        const remainingDelay = 1000 - (Date.now() - requestStartedAt);
        if (remainingDelay > 0) {
          await new Promise(resolve => setTimeout(resolve, remainingDelay));
        }

        console.error(error);
        Swal.fire({
          icon: "error",
          title: "Unable to Send Reset Email",
          text: error.text || error.message || "The reset request could not be completed. Please try again.",
          confirmButtonColor: "#0F5C5E"
        });
      }
    });
  </script>
</body>
</html>
